name: Dependency Security Scan

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths:
      - "requirements.txt"
  pull_request:
    paths:
      - "requirements.txt"
  workflow_dispatch: # Allow manual trigger

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit

      - name: Run Safety check
        run: |
          echo "🔍 Checking for known security vulnerabilities with Safety..."
          safety check --file requirements.txt --output text || true

      - name: Run pip-audit
        run: |
          echo "🔍 Auditing dependencies with pip-audit..."
          pip-audit --requirement requirements.txt || true

      - name: Check for dependency conflicts
        run: |
          echo "🔍 Checking for dependency conflicts..."
          pip install -r requirements.txt
          pip check

      - name: Create issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security vulnerabilities detected in dependencies',
              body: 'Automated security scan detected vulnerabilities. Please review the workflow logs.',
              labels: ['security', 'dependencies']
            })
