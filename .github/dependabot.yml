# Dependabot configuration for automatic dependency updates
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "sassenheimer"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group minor and patch updates together
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Allow specific dependency updates
    allow:
      - dependency-name: "instaloader"
      - dependency-name: "PyQt5"
      - dependency-name: "Pillow"
      - dependency-name: "requests"
      - dependency-name: "browser-cookie3"
      - dependency-name: "opencv-python"
      - dependency-name: "python-vlc"
      - dependency-name: "pyodbc"
    # Security updates are always created regardless of schedule
    versioning-strategy: increase
